<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0726" />
      <stop offset="50%" stop-color="#180b45" />
      <stop offset="100%" stop-color="#2a0520" />
    </linearGradient>
    <linearGradient id="tenkGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6042f5" />
      <stop offset="60%" stop-color="#a8256a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="650" cy="120" r="180" fill="#381cc9" fill-opacity="0.25" filter="blur(60px)" />
  <circle cx="150" cy="380" r="160" fill="#81052c" fill-opacity="0.2" filter="blur(50px)" />

  <!-- Top Badge -->
  <rect x="60" y="60" width="220" height="34" rx="17" fill="#221179" fill-opacity="0.6" stroke="#4c2ee6" stroke-width="1" />
  <circle cx="80" cy="77" r="5" fill="#10b981" />
  <text x="96" y="82" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">TENK SOLUTIONS, LLC</text>

  <!-- Title -->
  <text x="60" y="150" fill="url(#tenkGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">Business Operations</text>
  <text x="60" y="202" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="0.5">&amp; AI Automation</text>

  <!-- Subtitle -->
  <text x="60" y="250" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Eliminating business bottlenecks with AI workflows, executive reporting,
  </text>
  <text x="60" y="276" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    and scalable systems infrastructure. Serving DC, Maryland, Virginia &amp; Remote.
  </text>

  <!-- 3 Service Pill Badges -->
  <g transform="translate(60, 320)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="210" height="90" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Client Intake</text>
    <text x="20" y="52" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Automated onboarding,</text>
    <text x="20" y="68" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">qualification &amp; routing</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="210" height="90" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="250" y="32" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Staff Knowledge</text>
    <text x="250" y="52" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Internal AI assistants</text>
    <text x="250" y="68" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">&amp; instant doc retrieval</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="220" height="90" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="480" y="32" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Executive Reporting</text>
    <text x="480" y="52" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Live metric dashboards &amp;</text>
    <text x="480" y="68" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">automated performance</text>
  </g>

  <!-- URL Bottom Indicator -->
  <text x="60" y="460" fill="#64748b" font-family="monospace" font-size="13">tenksolutions.com  •  DC / MD / VA</text>
</svg>
