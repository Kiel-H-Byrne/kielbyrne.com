name: "Persona Automation & Dropzone Sync"

on:
  schedule:
    # Runs bi-weekly on the 1st and 15th of every month at noon UTC
    - cron: "0 12 1,15 * *"
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-personas:
    name: "Sync Dropzone & Update Personas"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v3

      - name: "Set up Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: "Synchronize Persona Dropzone"
        run: node scripts/sync-personas.mjs

      - name: "Commit & push changes if dropzone had new images"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/personas.json public/img/personas/
          if git diff --staged --quiet; then
            echo "No new persona changes to commit."
          else
            git commit -m "chore(personas): automated update of persona carousel roster"
            git push
          fi
